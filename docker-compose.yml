version: '3'
services:

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:${DB_PORT}"
    env_file:
      - .env
    networks:
      - network-music

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
        - ./:/var/www
    depends_on:
      - postgres
    networks:
      - network-music

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
        - "8000:8000"
        - "80:80"
        - "443:443"
    volumes:
        - ./:/var/www
        - ./Docker/nginx/:/etc/nginx/conf.d/
        - ./Docker/certs:/certs:ro
        - ./spa:/var/www/spa:ro
    networks:
        - network-music

  # MailHog: solo dev (arranca con COMPOSE_PROFILES=dev o `--profile dev`)
  mailhog:
      image: 'mailhog/mailhog:latest'
      profiles: ["dev"]
      ports:
        - '1025:1025'
        - '8025:8025'
      networks:
        - network-music

networks:
  network-music:
    driver: bridge
