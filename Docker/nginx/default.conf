server {
    listen 8000;
    index index.php;
    root /var/www/public;

    client_max_body_size 51g;
    client_body_buffer_size 512k;
    client_body_in_file_only clean;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# Produccion: HTTP -> HTTPS (ambos dominios)
server {
    listen 80;
    server_name api.vibeer.com vibeer.com;

    # Certbot (renovaciones webroot): root = ./Docker/certs/real montado como /certs/real
    location /.well-known/acme-challenge/ {
        root /certs/real;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Produccion: API (api.vibeer.com)
server {
    listen 443 ssl;
    http2 on;
    server_name api.vibeer.com;

    ssl_certificate /certs/real/fullchain.pem;
    ssl_certificate_key /certs/real/privkey.pem;

    root /var/www/public;
    index index.php;

    client_max_body_size 51g;
    client_body_buffer_size 512k;
    client_body_in_file_only clean;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# Produccion: SPA (vibeer.com) servida desde /var/www/spa (bind ./spa:/var/www/spa:ro)
server {
    listen 443 ssl;
    http2 on;
    server_name vibeer.com;

    ssl_certificate /certs/real/fullchain.pem;
    ssl_certificate_key /certs/real/privkey.pem;

    root /var/www/spa;
    index index.html;

    charset utf-8;
    client_max_body_size 100M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}